services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\Controller\:
        resource: '../src/Controller/*Controller.php'
        exclude:
            - '../src/Controller/BusinessRequestPayload.php'
            - '../src/Controller/BusinessResultPayload.php'
        tags: ['controller.service_arguments']

    App\EventSubscriber\BusinessHttpExceptionSubscriber:
        tags: ['kernel.event_subscriber']

    App\Repository\Debug\:
        resource: '../src/Repository/Debug/'

    App\Repository\Debug\DebugRelatingObjectStore:
        arguments:
            $filePath: '%kernel.project_dir%/var/relating-debug-store.json'

    App\Service\UuidRelatingIdGenerator: ~

    App\Service\DispatchingRelatingBusinessEventDispatcher:
        arguments:
            $eventDispatcher: '@event_dispatcher'

    App\Repository\RelationshipRepositoryInterface:
        alias: App\Repository\Debug\DebugRelationshipRepository

    App\Repository\LeadRepositoryInterface:
        alias: App\Repository\Debug\DebugLeadRepository

    App\Repository\OpportunityRepositoryInterface:
        alias: App\Repository\Debug\DebugOpportunityRepository

    App\Repository\ActivityRepositoryInterface:
        alias: App\Repository\Debug\DebugActivityRepository

    App\Repository\TimelineRecordRepositoryInterface:
        alias: App\Repository\Debug\DebugTimelineRecordRepository

    App\Repository\AiSuggestionRepositoryInterface:
        alias: App\Repository\Debug\DebugAiSuggestionRepository

    App\Service\RelatingIdGeneratorInterface:
        alias: App\Service\UuidRelatingIdGenerator

    App\Service\RelatingBusinessEventRecorderInterface:
        alias: App\Service\DispatchingRelatingBusinessEventDispatcher

    App\Service\VendorLeadReadServiceInterface:
        alias: App\Service\VendorLeadReadService

    App\Service\Application\StartRelationshipApplicationService: ~
    App\Service\Application\CaptureLeadApplicationService: ~
    App\Service\Application\QualifyLeadApplicationService: ~
    App\Service\Application\ConvertLeadApplicationService: ~
    App\Service\Application\OpenOpportunityApplicationService: ~
    App\Service\Application\TransitionOpportunityStageApplicationService: ~
    App\Service\Application\RecordActivityApplicationService: ~
    App\Service\Application\ProjectTimelineApplicationService: ~
    App\Service\Application\ReviewAiSuggestionApplicationService: ~
