services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\Controller\:
        resource: '../src/Controller/*Controller.php'
        exclude:
            - '../src/Controller/BusinessRequestPayload.php'
            - '../src/Controller/BusinessResultPayload.php'
        tags: ['controller.service_arguments']

    App\Debug\:
        resource: '../src/Debug/'

    App\Debug\DebugRelatingObjectStore:
        arguments:
            $filePath: '%kernel.project_dir%/var/relating-debug-store.json'

    App\Service\UuidRelatingIdGenerator: ~

    App\Service\DispatchingRelatingBusinessEventRecorder:
        arguments:
            $eventDispatcher: '@event_dispatcher'

    App\Repository\RelationshipRepositoryInterface:
        alias: App\Debug\DebugRelationshipRepository

    App\Repository\LeadRepositoryInterface:
        alias: App\Debug\DebugLeadRepository

    App\Repository\OpportunityRepositoryInterface:
        alias: App\Debug\DebugOpportunityRepository

    App\Repository\ActivityRepositoryInterface:
        alias: App\Debug\DebugActivityRepository

    App\Repository\TimelineEventRepositoryInterface:
        alias: App\Debug\DebugTimelineEventRepository

    App\Repository\AiSuggestionRepositoryInterface:
        alias: App\Debug\DebugAiSuggestionRepository

    App\Service\RelatingIdGeneratorInterface:
        alias: App\Service\UuidRelatingIdGenerator

    App\Service\RelatingBusinessEventRecorderInterface:
        alias: App\Service\DispatchingRelatingBusinessEventRecorder

    App\Application\Service\StartRelationshipApplicationService: ~
    App\Application\Service\CaptureLeadApplicationService: ~
    App\Application\Service\QualifyLeadApplicationService: ~
    App\Application\Service\ConvertLeadApplicationService: ~
    App\Application\Service\OpenOpportunityApplicationService: ~
    App\Application\Service\TransitionOpportunityStageApplicationService: ~
    App\Application\Service\RecordActivityApplicationService: ~
    App\Application\Service\ProjectTimelineApplicationService: ~
    App\Application\Service\ReviewAiSuggestionApplicationService: ~
