services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\Relating\Controller\:
        resource: '../src/Relating/Controller/*Controller.php'
        exclude:
            - '../src/Relating/Controller/BusinessRequestPayload.php'
            - '../src/Relating/Controller/BusinessResultPayload.php'
        tags: ['controller.service_arguments']

    App\Relating\Debug\:
        resource: '../src/Relating/Debug/'

    App\Relating\Debug\DebugRelatingObjectStore:
        arguments:
            $filePath: '%kernel.project_dir%/var/relating-debug-store.json'

    App\Relating\Service\UuidRelatingIdGenerator: ~

    App\Relating\Service\DispatchingRelatingBusinessEventRecorder:
        arguments:
            $eventDispatcher: '@event_dispatcher'

    App\Relating\Repository\RelationshipRepositoryInterface:
        alias: App\Relating\Debug\DebugRelationshipRepository

    App\Relating\Repository\LeadRepositoryInterface:
        alias: App\Relating\Debug\DebugLeadRepository

    App\Relating\Repository\OpportunityRepositoryInterface:
        alias: App\Relating\Debug\DebugOpportunityRepository

    App\Relating\Repository\ActivityRepositoryInterface:
        alias: App\Relating\Debug\DebugActivityRepository

    App\Relating\Repository\TimelineEventRepositoryInterface:
        alias: App\Relating\Debug\DebugTimelineEventRepository

    App\Relating\Repository\AiSuggestionRepositoryInterface:
        alias: App\Relating\Debug\DebugAiSuggestionRepository

    App\Relating\Service\RelatingIdGeneratorInterface:
        alias: App\Relating\Service\UuidRelatingIdGenerator

    App\Relating\Service\RelatingBusinessEventRecorderInterface:
        alias: App\Relating\Service\DispatchingRelatingBusinessEventRecorder

    App\Relating\Application\Service\StartRelationshipApplicationService: ~
    App\Relating\Application\Service\CaptureLeadApplicationService: ~
    App\Relating\Application\Service\QualifyLeadApplicationService: ~
    App\Relating\Application\Service\ConvertLeadApplicationService: ~
    App\Relating\Application\Service\OpenOpportunityApplicationService: ~
    App\Relating\Application\Service\TransitionOpportunityStageApplicationService: ~
    App\Relating\Application\Service\RecordActivityApplicationService: ~
    App\Relating\Application\Service\ProjectTimelineApplicationService: ~
    App\Relating\Application\Service\ReviewAiSuggestionApplicationService: ~
