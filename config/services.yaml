services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\Relating\Controller\:
        resource: '../src/Controller/*Controller.php'
        exclude:
            - '../src/Controller/RelationBusinessRequestPayload.php'
            - '../src/Controller/RelationBusinessResultPayload.php'
        tags: ['controller.service_arguments']

    App\Relating\EventSubscriber\RelationBusinessHttpExceptionSubscriber:
        tags: ['kernel.event_subscriber']

    App\Relating\Repository\Debug\:
        resource: '../src/Repository/Debug/'

    App\Relating\Repository\Debug\RelationDebugRelatingObjectStore:
        arguments:
            $filePath: '%kernel.project_dir%/var/relating-debug-store.json'

    App\Relating\Service\RelationUuidRelatingIdGenerator: ~

    App\Relating\Service\RelationDispatchingRelatingBusinessEventDispatcher:
        arguments:
            $eventDispatcher: '@event_dispatcher'

    App\Relating\Repository\RelationshipRepositoryInterface:
        alias: App\Relating\Repository\Debug\RelationDebugRelationshipRepository

    App\Relating\Repository\RelationLeadRepositoryInterface:
        alias: App\Relating\Repository\Debug\RelationDebugLeadRepository

    App\Relating\Repository\RelationOpportunityRepositoryInterface:
        alias: App\Relating\Repository\Debug\RelationDebugOpportunityRepository

    App\Relating\Repository\RelationActivityRepositoryInterface:
        alias: App\Relating\Repository\Debug\RelationDebugActivityRepository

    App\Relating\Repository\RelationTimelineRecordRepositoryInterface:
        alias: App\Relating\Repository\Debug\RelationDebugTimelineRecordRepository

    App\Relating\Repository\RelationAiSuggestionRepositoryInterface:
        alias: App\Relating\Repository\Debug\RelationDebugAiSuggestionRepository

    App\Relating\Service\RelationRelatingIdGeneratorInterface:
        alias: App\Relating\Service\RelationUuidRelatingIdGenerator

    App\Relating\Service\RelationRelatingBusinessEventRecorderInterface:
        alias: App\Relating\Service\RelationDispatchingRelatingBusinessEventDispatcher

    App\Relating\Service\RelationVendorLeadReadServiceInterface:
        alias: App\Relating\Service\RelationVendorLeadReadService

    App\Relating\Service\Application\RelationStartRelationshipApplicationService: ~
    App\Relating\Service\Application\RelationCaptureLeadApplicationService: ~
    App\Relating\Service\Application\RelationQualifyLeadApplicationService: ~
    App\Relating\Service\Application\RelationConvertLeadApplicationService: ~
    App\Relating\Service\Application\RelationOpenOpportunityApplicationService: ~
    App\Relating\Service\Application\RelationTransitionOpportunityStageApplicationService: ~
    App\Relating\Service\Application\RelationRecordActivityApplicationService: ~
    App\Relating\Service\Application\RelationProjectTimelineApplicationService: ~
    App\Relating\Service\Application\RelationReviewAiSuggestionApplicationService: ~
