# Relating route boundary:
# - business routes only;
# - no CRUD controllers;
# - no CRUD YAML routes;
# - no generic CRUD action routes.
#
# Current import is limited to Relating controllers that expose business routes.
# Any future controller added under src/Controller must pass the route
# boundary test in tests/RelatingRouteBoundaryTest.php.
relating_business_controllers:
    resource: ../../src/Controller/
    type: attribute
