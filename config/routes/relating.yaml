# Relating route boundary:
# - business routes only;
# - no CRUD controllers;
# - no CRUD YAML routes;
# - no index/create/read/update/delete action routes.
#
# Current import is limited to Relating controllers that expose business routes.
# Any future controller added under src/Relating/Controller must pass the route
# boundary test in tests/Relating/RelatingRouteBoundaryTest.php.
relating_business_controllers:
    resource: ../../src/Relating/Controller/
    type: attribute
